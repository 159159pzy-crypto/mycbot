name: ${COMPOSE_PROJECT_NAME:-mybot}

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  MYBOT_API_HOST: "0.0.0.0"
  MYBOT_API_PORT: "8000"
  MYBOT_HEALTH_PROBE_TIMEOUT_SECONDS: ${MYBOT_HEALTH_PROBE_TIMEOUT_SECONDS:-2}
  MYBOT_DATABASE_CONNECT_TIMEOUT_SECONDS: ${MYBOT_DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
  MYBOT_DATABASE_READ_TIMEOUT_SECONDS: ${MYBOT_DATABASE_READ_TIMEOUT_SECONDS:-3}
  MYBOT_DATABASE_URL: >-
    postgresql+psycopg://${POSTGRES_USER:-mybot}:${POSTGRES_PASSWORD:-mybot-local-change-me}@postgres:5432/${POSTGRES_DB:-mybot}
  MYBOT_LOG_LEVEL: ${MYBOT_LOG_LEVEL:-INFO}
  MYBOT_OTEL_EXPORTER_OTLP_ENDPOINT: ${MYBOT_OTEL_EXPORTER_OTLP_ENDPOINT:-}
  MYBOT_REDIS_CONNECT_TIMEOUT_SECONDS: ${MYBOT_REDIS_CONNECT_TIMEOUT_SECONDS:-2}
  MYBOT_REDIS_READ_TIMEOUT_SECONDS: ${MYBOT_REDIS_READ_TIMEOUT_SECONDS:-2}
  MYBOT_REDIS_URL: redis://redis:6379/0
  MYBOT_SANDBOX_CONNECTION_ID: ${MYBOT_SANDBOX_CONNECTION_ID:-sandbox}

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  image: mybot-python:${MYBOT_IMAGE_TAG:-dev}
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  logging: *service-logging
  mem_limit: 512m
  cpus: 1.0
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *service-logging
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mybot-local-change-me}
      POSTGRES_USER: ${POSTGRES_USER:-mybot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *service-logging
    mem_limit: 256m
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend

  searxng:
    image: searxng/searxng:${SEARXNG_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *service-logging
    mem_limit: 512m
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8080}/
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_IMAGE_PROXY: "true"
      SEARXNG_LIMITER: "false"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY:-mybot-searxng-local-change-me}
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  api:
    <<: *app-service
    command:
      - python
      - -m
      - mybot
      - api
    environment:
      <<: *app-environment
      MYBOT_OPERATOR_TOKEN: ${MYBOT_OPERATOR_TOKEN:-}
      MYBOT_EMBEDDING_API_KEY: ${MYBOT_EMBEDDING_API_KEY:-}
      MYBOT_EMBEDDING_BASE_URL: ${MYBOT_EMBEDDING_BASE_URL:-}
      MYBOT_EMBEDDING_MODEL: ${MYBOT_EMBEDDING_MODEL:-text-embedding-3-small}
      MYBOT_LLM_API_KEY: ${MYBOT_LLM_API_KEY:-}
      MYBOT_LLM_BASE_URL: ${MYBOT_LLM_BASE_URL:-}
      MYBOT_LLM_MODEL: ${MYBOT_LLM_MODEL:-deepseek-chat}
      MYBOT_MODEL_API_KEYS: ${MYBOT_MODEL_API_KEYS:-}
      # An empty grants value falls back to the application default of {}.
      MYBOT_PLUGIN_CAPABILITY_GRANTS: ${MYBOT_PLUGIN_CAPABILITY_GRANTS:-}
      MYBOT_PLUGIN_INVOKE_TIMEOUT_SECONDS: ${MYBOT_PLUGIN_INVOKE_TIMEOUT_SECONDS:-20}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
      - plugin-control

  gateway:
    <<: *app-service
    command:
      - python
      - -m
      - mybot
      - gateway
    environment:
      <<: *app-environment
      MYBOT_QQ_ACCESS_TOKEN: ${MYBOT_QQ_ACCESS_TOKEN:-}
      MYBOT_QQ_CONNECTION_ID: ${MYBOT_QQ_CONNECTION_ID:-qq-main}
      MYBOT_TELEGRAM_API_BASE_URL: ${MYBOT_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      MYBOT_TELEGRAM_BOT_TOKEN: ${MYBOT_TELEGRAM_BOT_TOKEN:-}
      MYBOT_TELEGRAM_CONNECTION_ID: ${MYBOT_TELEGRAM_CONNECTION_ID:-telegram-main}
      MYBOT_TELEGRAM_POLL_TIMEOUT_SECONDS: ${MYBOT_TELEGRAM_POLL_TIMEOUT_SECONDS:-50}
      NAPCAT_WS_URL: ${NAPCAT_WS_URL:-}
    extra_hosts:
      - host.docker.internal:host-gateway

  agent-worker:
    <<: *app-service
    command:
      - python
      - -m
      - mybot
      - agent-worker
    environment:
      <<: *app-environment
      MYBOT_AGENT_CONVERSATION_DAILY_TOKEN_CEILING: ${MYBOT_AGENT_CONVERSATION_DAILY_TOKEN_CEILING:-20000}
      MYBOT_AGENT_DAILY_TOKEN_CEILING: ${MYBOT_AGENT_DAILY_TOKEN_CEILING:-200000}
      MYBOT_EMBEDDING_API_KEY: ${MYBOT_EMBEDDING_API_KEY:-}
      MYBOT_EMBEDDING_BASE_URL: ${MYBOT_EMBEDDING_BASE_URL:-}
      MYBOT_EMBEDDING_MODEL: ${MYBOT_EMBEDDING_MODEL:-text-embedding-3-small}
      MYBOT_LLM_API_KEY: ${MYBOT_LLM_API_KEY:-}
      MYBOT_LLM_BASE_URL: ${MYBOT_LLM_BASE_URL:-}
      MYBOT_LLM_MODEL: ${MYBOT_LLM_MODEL:-deepseek-chat}
      MYBOT_MODEL_API_KEYS: ${MYBOT_MODEL_API_KEYS:-}
      MYBOT_MODEL_CHANNEL_COOLDOWN_SECONDS: ${MYBOT_MODEL_CHANNEL_COOLDOWN_SECONDS:-60}
      MYBOT_MODEL_CHANNELS_CACHE_TTL_SECONDS: ${MYBOT_MODEL_CHANNELS_CACHE_TTL_SECONDS:-30}
      MYBOT_TELEGRAM_API_BASE_URL: ${MYBOT_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      MYBOT_TELEGRAM_BOT_TOKEN: ${MYBOT_TELEGRAM_BOT_TOKEN:-}
      MYBOT_VISION_MODE: ${MYBOT_VISION_MODE:-describe}
      MYBOT_VISION_MAX_DESCRIPTION_CHARS: ${MYBOT_VISION_MAX_DESCRIPTION_CHARS:-2000}
      MYBOT_VISION_MAX_IMAGE_BYTES: ${MYBOT_VISION_MAX_IMAGE_BYTES:-10000000}
      MYBOT_VISION_IMAGE_DOWNLOAD_TIMEOUT_SECONDS: ${MYBOT_VISION_IMAGE_DOWNLOAD_TIMEOUT_SECONDS:-30}
      MYBOT_FALLBACK_NOT_CONFIGURED: ${MYBOT_FALLBACK_NOT_CONFIGURED:-语言模型尚未配置, 请管理员先完成模型渠道设置。}
      MYBOT_FALLBACK_LLM_FAILURE: ${MYBOT_FALLBACK_LLM_FAILURE:-语言模型暂时不可用, 请稍后再试。}
      MYBOT_FALLBACK_BUDGET_EXCEEDED: ${MYBOT_FALLBACK_BUDGET_EXCEEDED:-本会话今天的 token 预算已用完, 明天再继续聊吧。}
      MYBOT_FALLBACK_EMPTY_REPLY: ${MYBOT_FALLBACK_EMPTY_REPLY:-抱歉, 这次没能组织好回复, 请稍后再试。}
      MYBOT_FALLBACK_MODERATION: ${MYBOT_FALLBACK_MODERATION:-回复触发了内容策略, 已停止发送。}
      MYBOT_MEMORY_ENABLED: ${MYBOT_MEMORY_ENABLED:-true}
      MYBOT_MEMORY_MIN_CONFIDENCE: ${MYBOT_MEMORY_MIN_CONFIDENCE:-0.6}
      MYBOT_MEMORY_RETRIEVAL_LIMIT: ${MYBOT_MEMORY_RETRIEVAL_LIMIT:-5}
      MYBOT_MEMORY_TOKEN_BUDGET: ${MYBOT_MEMORY_TOKEN_BUDGET:-1200}
      MYBOT_MEMORY_CORE_PERSONA_TOKEN_BUDGET: ${MYBOT_MEMORY_CORE_PERSONA_TOKEN_BUDGET:-800}
      MYBOT_MEMORY_CORE_USER_PROFILE_TOKEN_BUDGET: ${MYBOT_MEMORY_CORE_USER_PROFILE_TOKEN_BUDGET:-600}
      MYBOT_MEMORY_CORE_TOOLS_APPROVAL_REQUIRED: ${MYBOT_MEMORY_CORE_TOOLS_APPROVAL_REQUIRED:-true}
      MYBOT_MEMORY_FLUSH_ENABLED: ${MYBOT_MEMORY_FLUSH_ENABLED:-true}
      MYBOT_MEMORY_FLUSH_DEBOUNCE_TTL_SECONDS: ${MYBOT_MEMORY_FLUSH_DEBOUNCE_TTL_SECONDS:-900}
      MYBOT_MEMORY_FLUSH_MAX_MESSAGES: ${MYBOT_MEMORY_FLUSH_MAX_MESSAGES:-24}
      MYBOT_MEMORY_FLUSH_TOKEN_BUDGET: ${MYBOT_MEMORY_FLUSH_TOKEN_BUDGET:-2000}
      MYBOT_AGENT_GRANTED_CAPABILITIES: ${MYBOT_AGENT_GRANTED_CAPABILITIES:-web.search,web.fetch,memory.write}
      MYBOT_PLUGIN_BROKER_URL: ${MYBOT_WORKER_PLUGIN_BROKER_URL:-http://api:8000}
      MYBOT_SEARXNG_URL: ${MYBOT_SEARXNG_URL:-http://searxng:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy

  maintenance-worker:
    <<: *app-service
    command:
      - python
      - -m
      - mybot
      - maintenance-worker
    environment:
      <<: *app-environment
      MYBOT_EMBEDDING_API_KEY: ${MYBOT_EMBEDDING_API_KEY:-}
      MYBOT_EMBEDDING_BASE_URL: ${MYBOT_EMBEDDING_BASE_URL:-}
      MYBOT_EMBEDDING_MODEL: ${MYBOT_EMBEDDING_MODEL:-text-embedding-3-small}
      MYBOT_LLM_API_KEY: ${MYBOT_LLM_API_KEY:-}
      MYBOT_LLM_BASE_URL: ${MYBOT_LLM_BASE_URL:-}
      MYBOT_LLM_MODEL: ${MYBOT_LLM_MODEL:-deepseek-chat}
      MYBOT_MODEL_API_KEYS: ${MYBOT_MODEL_API_KEYS:-}
      MYBOT_MODEL_CHANNEL_COOLDOWN_SECONDS: ${MYBOT_MODEL_CHANNEL_COOLDOWN_SECONDS:-60}
      MYBOT_MODEL_CHANNELS_CACHE_TTL_SECONDS: ${MYBOT_MODEL_CHANNELS_CACHE_TTL_SECONDS:-30}
      MYBOT_MEMORY_ENABLED: ${MYBOT_MEMORY_ENABLED:-true}
      MYBOT_MEMORY_MIN_CONFIDENCE: ${MYBOT_MEMORY_MIN_CONFIDENCE:-0.6}
      MYBOT_MEMORY_MAINTENANCE_INTERVAL_SECONDS: ${MYBOT_MEMORY_MAINTENANCE_INTERVAL_SECONDS:-3600}
      MYBOT_MEMORY_CONSOLIDATION_ENABLED: ${MYBOT_MEMORY_CONSOLIDATION_ENABLED:-true}
      MYBOT_MEMORY_CONSOLIDATION_INTERVAL_SECONDS: ${MYBOT_MEMORY_CONSOLIDATION_INTERVAL_SECONDS:-86400}
      MYBOT_MEMORY_CONSOLIDATION_LOOKBACK_HOURS: ${MYBOT_MEMORY_CONSOLIDATION_LOOKBACK_HOURS:-48}
      MYBOT_MEMORY_CONSOLIDATION_CONVERSATION_LIMIT: ${MYBOT_MEMORY_CONSOLIDATION_CONVERSATION_LIMIT:-20}
      MYBOT_MEMORY_CONSOLIDATION_MESSAGE_LIMIT: ${MYBOT_MEMORY_CONSOLIDATION_MESSAGE_LIMIT:-40}
      MYBOT_MEMORY_CONSOLIDATION_MEMORY_LIMIT: ${MYBOT_MEMORY_CONSOLIDATION_MEMORY_LIMIT:-20}
      MYBOT_MEMORY_CONSOLIDATION_TOKEN_BUDGET: ${MYBOT_MEMORY_CONSOLIDATION_TOKEN_BUDGET:-4000}
      MYBOT_PROACTIVE_ENABLED: ${MYBOT_PROACTIVE_ENABLED:-false}
      MYBOT_PROACTIVE_MIN_INTERVAL_HOURS: ${MYBOT_PROACTIVE_MIN_INTERVAL_HOURS:-24}
      MYBOT_PROACTIVE_QUIET_END_HOUR: ${MYBOT_PROACTIVE_QUIET_END_HOUR:-8}
      MYBOT_PROACTIVE_QUIET_START_HOUR: ${MYBOT_PROACTIVE_QUIET_START_HOUR:-22}

  plugin-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: mybot-python:${MYBOT_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *service-logging
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - python
      - -m
      - mybot
      - plugin-runner
    environment:
      MYBOT_PLUGIN_BROKER_URL: ${MYBOT_PLUGIN_BROKER_URL:-http://api:8000}
      MYBOT_PLUGIN_CONFIG: ${MYBOT_PLUGIN_CONFIG:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - plugin-control

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: mybot-web:${MYBOT_IMAGE_TAG:-dev}
    restart: unless-stopped
    logging: *service-logging
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/static-health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  searxng-cache:

networks:
  backend:
    driver: bridge
  plugin-control:
    driver: bridge
    internal: true
