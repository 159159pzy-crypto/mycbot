name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, type, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.24"

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Test
        run: pnpm --dir web test -- --run

      - name: Build
        run: pnpm --dir web build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Compose version
        run: docker compose version

      - name: Validate configuration
        run: docker compose --env-file .env.example config --quiet

  images:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - python
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Python image
        run: docker build --tag mybot-python:ci .

      - name: Build web image
        run: docker build --tag mybot-web:ci web

      - name: Smoke-test hardened web image
        run: |
          cleanup() {
            docker rm --force mybot-web-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --rm \
            --name mybot-web-smoke \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --publish 127.0.0.1:18080:8080 \
            mybot-web:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/static-health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs mybot-web-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/static-health

  integration:
    name: Database migrations and API health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - python
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mybot
          POSTGRES_PASSWORD: mybot-ci
          POSTGRES_USER: mybot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mybot -d mybot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MYBOT_API_HOST: 127.0.0.1
      MYBOT_API_PORT: "8000"
      MYBOT_DATABASE_URL: postgresql+psycopg://mybot:mybot-ci@127.0.0.1:5432/mybot
      MYBOT_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.24"

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Exercise migrations in both directions
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Start API
        run: |
          uv run python -m mybot api >"$RUNNER_TEMP/mybot-api.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/mybot-api.pid"

      - name: Check liveness and readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/mybot-api.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready

      - name: Show API log after failure
        if: failure()
        run: cat "$RUNNER_TEMP/mybot-api.log"

      - name: Stop API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mybot-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/mybot-api.pid")" || true
          fi
