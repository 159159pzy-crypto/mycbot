use_default_settings: true

general:
  debug: false
  instance_name: mybot search

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  # SearXNG overrides this with the SEARXNG_SECRET environment value. This
  # checked-in string is not a production secret.
  secret_key: mybot-searxng-local-change-me
  limiter: false
  image_proxy: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
